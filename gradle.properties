org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
# 검색 서버. 로컬 서버로 바꾸려면 -Pmidwayder.apiOrigin=http://10.0.2.2:3000 (에뮬레이터) 처럼 넘긴다.
midwayder.apiOrigin=https://midwayder.up.railway.app
# 시연 영상용 고정 출발지(집 위치 노출 방지). 예: -Pmidwayder.demoOrigin="37.5547,126.9707,서울역". 기본은 비움(기기 위치 사용).
midwayder.demoOrigin=
# 공모전 시연 전용 검색 비밀값은 여기에 넣지 않는다(커밋 금지). -Pmidwayder.contestToken=... 또는 ~/.gradle/gradle.properties 로 넣는다.
